# The built panel frontend (public/build) for the pinned Hydrodactyl release plus the overlay,
# for servers with too little memory to run "pnpm build" themselves (docs/install.md). The
# artifact "panel-build" holds panel-build.tar.gz, its SHA-256 and BUILD-INFO (theme and upstream
# commit). config/app.php gets the release version (UPSTREAM_REF), as in Hydrodactyl's release
# archive, so the panel shows "v6.4.2" and not "canary".
name: panel-build

on:
  push:
    branches: [main]
    paths:
      - overlay/**
      - scripts/**
      - upstream.lock
      - version.txt
      - .github/workflows/panel-build.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: panel-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the pinned Hydrodactyl, set the release version, apply the overlay
        run: |
          set -euo pipefail
          . upstream.lock
          panel="$RUNNER_TEMP/panel"
          scripts/fetch-upstream.sh "$panel"
          sed -i -E "s/('version' => )'[^']*'/\1'${UPSTREAM_REF}'/" "$panel/config/app.php"
          grep -q "'version' => '${UPSTREAM_REF}'" "$panel/config/app.php"
          scripts/install.sh --panel "$panel" --yes --no-migrate --no-build

      - name: Build
        working-directory: ${{ runner.temp }}/panel
        run: |
          corepack enable
          CI=true pnpm install --frozen-lockfile
          pnpm build

      - name: Pack
        env:
          THEME_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          . upstream.lock
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          tar -C "$RUNNER_TEMP/panel/public" --owner=0 --group=0 --sort=name -czf "$out/panel-build.tar.gz" build
          (cd "$out" && sha256sum panel-build.tar.gz > panel-build.tar.gz.sha256)
          {
            echo "theme_commit=$THEME_COMMIT"
            echo "theme_version=$(cat version.txt)"
            echo "upstream_ref=$UPSTREAM_REF"
            echo "upstream_commit=$(git -C "$RUNNER_TEMP/panel" rev-parse HEAD)"
          } > "$out/BUILD-INFO"
          cat "$out/BUILD-INFO" "$out/panel-build.tar.gz.sha256"

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-build
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 90

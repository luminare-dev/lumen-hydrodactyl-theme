# The overlay on a real panel: apply it to the pinned Hydrodactyl commit (upstream.lock), build
# the frontend with Hydrodactyl's own checks, run Hydrodactyl's PHPUnit suites plus the Lumen
# tests, then boot the panel image with MariaDB and Redis and take screenshots of the client and
# admin pages in dark and light mode (artifact "screenshots").
name: panel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: panel-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the pinned Hydrodactyl and apply the overlay
        run: |
          scripts/fetch-upstream.sh "$RUNNER_TEMP/panel"
          scripts/install.sh --panel "$RUNNER_TEMP/panel" --yes --no-migrate --no-build

      - name: Install the locked packages (pnpm from packageManager)
        working-directory: ${{ runner.temp }}/panel
        run: |
          corepack enable
          CI=true pnpm install --frozen-lockfile

      - name: Biome on the Lumen files and the patched files
        working-directory: ${{ runner.temp }}/panel
        run: |
          pnpm exec biome check resources/scripts/lumen \
            resources/scripts/lib/appearance.ts \
            resources/scripts/components/elements/HydroLogo.tsx \
            resources/scripts/routers/AuthenticationRouter.tsx \
            resources/scripts/components/admin/AdminApp.tsx

      - name: TypeScript (fails on errors in Lumen or patched files)
        working-directory: ${{ runner.temp }}/panel
        run: |
          set +e
          pnpm exec tsc -p tsconfig.json --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1
          echo "tsc exit $? ($(grep -c 'error TS' "$RUNNER_TEMP/tsc.log") errors in the whole tree)"
          set -e
          ours='^resources/scripts/(lumen/|lib/appearance\.ts|components/elements/HydroLogo\.tsx'
          ours="$ours|routers/AuthenticationRouter\.tsx|components/admin/AdminApp\.tsx)"
          if grep -E "$ours" "$RUNNER_TEMP/tsc.log"; then
            exit 1
          fi

      - name: Hydrodactyl's appearance tests (cover the patched saveAppearance)
        working-directory: ${{ runner.temp }}/panel
        run: pnpm test:appearance

      - name: Build
        working-directory: ${{ runner.temp }}/panel
        run: pnpm build

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-build
          path: ${{ runner.temp }}/panel/public/build
          if-no-files-found: error
          retention-days: 7

  php:
    name: php
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP 8.4 (Ubuntu packages from the ondrej/php PPA)
        run: |
          sudo add-apt-repository -y ppa:ondrej/php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.4-cli php8.4-bcmath php8.4-curl php8.4-gd php8.4-intl \
            php8.4-mbstring php8.4-mysql php8.4-xml php8.4-zip >/dev/null
          sudo update-alternatives --set php /usr/bin/php8.4
          php -v
          curl -fsSL https://getcomposer.org/installer | php -- --quiet --install-dir="$RUNNER_TEMP"

      - name: Fetch the pinned Hydrodactyl, apply the overlay, add the Lumen tests
        run: |
          scripts/fetch-upstream.sh "$RUNNER_TEMP/panel"
          scripts/install.sh --panel "$RUNNER_TEMP/panel" --yes --no-migrate --no-build
          mkdir -p "$RUNNER_TEMP/panel/tests/Integration/Lumen"
          cp ci/phpunit/*.php "$RUNNER_TEMP/panel/tests/Integration/Lumen/"

      - name: Take the frontend build (the admin shell renders Vite tags)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-build
          path: ${{ runner.temp }}/panel/public/build

      - name: Composer install
        working-directory: ${{ runner.temp }}/panel
        run: php "$RUNNER_TEMP/composer.phar" install --no-interaction --prefer-dist --no-progress

      - name: Lumen tests
        working-directory: ${{ runner.temp }}/panel
        run: |
          cp .env.ci .env
          php vendor/bin/phpunit tests/Integration/Lumen

      - name: Hydrodactyl's own Unit and Integration suites, with the overlay installed
        working-directory: ${{ runner.temp }}/panel
        run: php vendor/bin/phpunit --testsuite=Integration,Unit

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the pinned Hydrodactyl and apply the overlay
        run: |
          scripts/fetch-upstream.sh "$RUNNER_TEMP/panel"
          scripts/install.sh --panel "$RUNNER_TEMP/panel" --yes --no-migrate --no-build
          cp ci/seed.php "$RUNNER_TEMP/panel/ci-seed.php"

      - name: Build the panel image (Hydrodactyl's Dockerfile)
        run: docker build -t hydrodactyl-lumen:ci "$RUNNER_TEMP/panel"

      - name: Boot the panel with MariaDB and Redis
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "HASHIDS_SALT=$(openssl rand -hex 10)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
          } > ci/.env
          echo "SEED_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          docker compose -f ci/docker-compose.yml --env-file ci/.env up -d
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8080/auth/login; then
              echo "up after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8080/auth/login

      - name: Seed example data
        run: |
          docker compose -f ci/docker-compose.yml --env-file ci/.env exec -T -e SEED_PASSWORD panel \
            php /app/ci-seed.php | tee "$RUNNER_TEMP/seed.log"
          echo "SERVER_ID=$(tail -n 1 "$RUNNER_TEMP/seed.log")" >> "$GITHUB_ENV"

      - name: Screenshots (Playwright, Chromium)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/ci/screenshots.mjs" .
          node screenshots.mjs http://localhost:8080 "$GITHUB_WORKSPACE/screenshots" "$SERVER_ID"

      - name: Panel logs
        if: always()
        run: |
          dc="docker compose -f ci/docker-compose.yml --env-file ci/.env"
          $dc logs --tail 200 panel > screenshots-panel.log 2>&1 || true
          $dc exec -T panel \
            sh -c 'tail -n 200 /app/storage/logs/*.log' >> screenshots-panel.log 2>&1 || true
          tail -n 60 screenshots-panel.log

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            screenshots/
            screenshots-panel.log
          if-no-files-found: warn
          retention-days: 30

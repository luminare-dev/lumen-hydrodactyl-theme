# CI only: the patched panel image with MariaDB and Redis, seeded with example data.
# APP_KEY, HASHIDS_SALT and DB_PASSWORD come from the workflow (random per run).
services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  cache:
    image: redis:7-alpine
  panel:
    image: hydrodactyl-lumen:ci
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "8080:80"
    environment:
      APP_URL: http://localhost:8080
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: noreply@example.com
      APP_ENVIRONMENT_ONLY: "false"
      HASHIDS_SALT: ${HASHIDS_SALT:?}
      HASHIDS_LENGTH: "8"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${DB_PASSWORD:?}
      CACHE_DRIVER: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: cache
      SESSION_SECURE_COOKIE: "false"
      MAIL_DRIVER: log
      MAIL_MAILER: log
